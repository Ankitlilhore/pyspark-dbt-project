-- I have used snapshots in dbt to load all table in gold layer
-- This tables are ready for analysis
-- Here I have created dimension tables



snapshots:
  - name: DimCustomers
    relation: source('source_silver', 'customers')
    config:
      schema: gold
      database: pyspark_dbt
      unique_key: customer_id
      strategy: timestamp
      updated_at: last_updated_timestamp
      dbt_valid_to_current: "to_date('9999-12-31')"

  - name: DimDrivers
    relation: source('source_silver', 'drivers')
    config:
      schema: gold
      database: pyspark_dbt
      unique_key: driver_id
      strategy: timestamp
      updated_at: last_updated_timestamp
      dbt_valid_to_current: "to_date('9999-12-31')"

